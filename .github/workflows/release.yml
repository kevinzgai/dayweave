# 织日 DayWeave 自动发布
# 触发方式：推送 v 开头的 tag（如 v1.3.1），自动构建 Windows MSI 并发布到 GitHub Releases
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 允许创建 Release 并上传产物

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 自动读取 package.json 的 packageManager 字段（pnpm@12.14.0）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      # 构建 MSI 并创建 Release、上传安装包
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '织日 DayWeave ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包：下载下方 DayWeave_*_x64_en-US.msi 安装。更新内容请查看提交记录。'
          releaseDraft: false
          prerelease: false
