[package]
name = "dayweave"
version = "1.3.8"
description = "织日 · 把时间和念头织成每一天"
authors = ["Kevin"]
edition = "2021"

[lib]
name = "dayweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
